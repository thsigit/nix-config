# Static LiteLLM config.yaml — single source of truth.
# Hand-maintained, committed to nix-lab. Copied to /var/lib/litellm/config.yaml
# at activation. litellm-cli edits this file directly (manual only); it is NOT
# generated at build time.
#
# API keys are injected at runtime via the environment file (sops providers.env):
#   os.environ/NVIDIA_API_KEY, os.environ/OPENROUTER_API_KEY, os.environ/FREETHEAI_API_KEY

model_list:
  # ── nvidia (direct NIM, whitelist) ─────────────────────────────────────────
  - model_name: nvidia/google/gemma-4-31b-it
    litellm_params:
      model: openai/google/gemma-4-31b-it
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
