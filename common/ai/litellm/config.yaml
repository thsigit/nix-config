# Static LiteLLM config.yaml — FIRST-BOOT SEED ONLY.
# This file is copied to /srv/appdata/litellm/config.yaml ONLY on first deployment
# (or if the live file is missing/empty). After that, the live config is
# admin-edited (by hand or litellm-cli) and NEVER re-rendered by rebuilds.
#
# Remote providers (NVIDIA NIM, Cloudflare Workers AI) are managed in the live
# config at /srv/appdata/litellm/config.yaml and persist across rebuilds.
# This seed ONLY includes local llama.cpp models.

model_list:
  # ── local llama.cpp router (http://127.0.0.1:8080/v1) ─────────────
  - model_name: local/tinyllama
    litellm_params:
      model: openai/tinyllama
      api_base: http://127.0.0.1:8080/v1
      api_key: sk-local
    model_info:
      disable_background_health_check: true

  - model_name: local/qwen2.5-coder
    litellm_params:
      model: openai/qwen2.5-coder
      api_base: http://127.0.0.1:8080/v1
      api_key: sk-local
    model_info:
      disable_background_health_check: true
  - model_name: local/qwen3
    litellm_params:
      model: openai/qwen3
      api_base: http://127.0.0.1:8080/v1
      api_key: sk-local
    model_info:
      disable_background_health_check: true
  - model_name: local/sailor2-1b
    litellm_params:
      model: openai/sailor2-1b
      api_base: http://127.0.0.1:8080/v1
      api_key: sk-local
    model_info:
      disable_background_health_check: true
  - model_name: local/mxbai-embed-large
    litellm_params:
      model: openai/mxbai-embed-large
      api_base: http://127.0.0.1:8080/v1
      api_key: sk-local
    model_info:
      disable_background_health_check: true

router_settings:
  routing_strategy: usage-based-routing
  num_retries: 2
  enable_pre_call_checks: true

litellm_settings:
  json_logs: true
  drop_params: true
  success_callback:
    - usage_logger.usage_callback

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  background_health_checks: true
