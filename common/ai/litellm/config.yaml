model_alias:
  local-chat: ollama/llama3.2
  cloud-chat: openrouter/openrouter/free
  deep-reasoning: openrouter/openrouter/free
  coding-agent: openrouter/openrouter/free

fallbacks:
  - ollama/llama3.2: [openrouter/openrouter/free]
  - openrouter/openrouter/free: [freetheai/glm/glm-4.5]

router_settings:
  routing_strategy: usage-based-routing
  num_retries: 2
  enable_pre_call_checks: true

litellm_settings:
  json_logs: true
  drop_params: true
  success_callback:
    - usage_logger.usage_callback

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
