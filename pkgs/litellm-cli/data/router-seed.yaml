# Router configuration: maps logical capabilities to logical model IDs,
# and defines how logical model IDs resolve to actual provider + model.
#
# Capabilities describe what you want to DO (chat, reason, see, ...).
# Logical model IDs abstract away which provider serves them.
# Changing a logical model's provider does NOT require editing the capability
# routing — only the models section below.

capabilities:
  chat:
    primary: local-chat
    fallback:
      - fast-chat
      - cloud-chat

  reasoning:
    primary: deep-reasoning
    fallback:
      - fast-reasoning

  vision:
    primary: gemini-vision

  code:
    primary: coding-agent
    fallback:
      - coding-fast

  ocr:
    primary: gemini-vision

  image:
    primary: cloud-chat



models:
  local-chat:
    provider: ollama
    model: llama3.2

  fast-chat:
    provider: groq
    model: llama-3.3-70b-versatile

  cloud-chat:
    provider: openrouter
    model: meta-llama/llama-3.3-70b-instruct:free

  deep-reasoning:
    provider: openrouter
    model: qwen/qwen3-next-80b-a3b-instruct:free

  fast-reasoning:
    provider: groq
    model: llama-4-maverick-17b-128e-instruct

  gemini-vision:
    provider: gemini
    model: gemini-2.5-flash-lite

  coding-agent:
    provider: openrouter
    model: qwen/qwen3-coder:free

  coding-fast:
    provider: groq
    model: llama-4-maverick-17b-128e-instruct
